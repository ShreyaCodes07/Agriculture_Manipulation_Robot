services:
  - type: web
    name: agri-manipulation-robot
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: MODE
        value: simulation
      - key: PYTHON_VERSION
        value: 3.11.9
